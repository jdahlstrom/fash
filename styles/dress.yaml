# DRESS STYLES
#
# Generic combinable:
#   top styles
#     sleeves, neckline unspecified
#     neckline, sleeves unspecified
#     sleeved neckline + sleeves
#     sleeveless neckline + sleeveless
#   upper styles
#   waist styles
#   skirt cut
#   skirt length
#   hem cut (+trim)
#
# Skirted versions of upper garments:
#   shirt
#   sweater
#   etc.
#
# Specific styles, don't mix well with most options:
#   apron
#   gypsy
#   etc.

dress:
  # Specific traditional, ethnic etc. styles
  # Should not be combined with most other styles except length
  casual:
    - apron
    - blouson
    - cargo
    - gypsy
    - kaftan
    - overall
    - pinafore
    - prairie
    - sari
    - sarong
    - wrap

  smart:
    - bodycon # TODO can have neckline, sleeves
    - cheongsam
    - cocktail
    - dirndl
    - pegged
    - pencil
    - sheath
    - shirt # collar type at least
    - tube # can have neckline, sleeves, should have own category


  # TODO separate skirt
  lounge:
    # - night  TODO these should be combinatory with the below
    # - lounge

    # Skirt/silhouette
    - a-line
    - circle
    - column
    - draped
    - flared
    - shift
    - slip
    - smock
    - tiered
    - wrap

    # Bodice
    # TODO unify duplicates
    - babydoll
    - cami
    - hoodie
    - sweatshirt
    - tank
    - t-shirt

  # TODO nightgown is different from the others
  lounge-gown:
    # "A dressing gown, housecoat or morning gown is a robe, a loose-fitting outer garment, worn by either men or women. They are similar to a bathrobe but without the absorbent material.
    # "A dressing gown or a housecoat is a loose, open-fronted gown closed with a fabric belt that is put on over nightwear on rising from bed, or, less commonly today, worn over some day clothes when partially dressed or undressed in the morning or evening (for example, over a man's shirt and trousers without jacket and tie)."
    - dressing gown
    - morning gown

    # https://en.wikipedia.org/wiki/Nightgown
    # "A nightgown, nightie or nightdress is a loosely hanging item of nightwear, and is commonly worn by women and girls.
    # "A nightgown is made from cotton, silk, satin, or nylon and may be decorated with lace appliqués or embroidery at the bust and hem.
    # "A nightgown may have any neckline, and may have sleeves of any type, or be sleeveless, and any shoulder strap or back style.
    # "The length of a nightgown may vary from hip-length to floor-length. A short nightgown can be called a "shortie" or a "babydoll", depending on the style.
    # "The sweep (taper from top to bottom) of the night gown can vary from virtually straight, to full circle sweep, like the Olga gown.
    # "A slip nightgown may be used as a nightgown or as a full slip. Nightgowns may be worn with a matching outer garment such as a robe, a sheer chiffon peignoir, or a dressing gown, to make them appropriate for receiving guests."
    # Almost synonymous with nightdress, but perhaps finer/fancier
    - nightgown

    # https://en.wikipedia.org/wiki/Kimono
    # "The kimono (着物; Japanese pronunciation: [kʲi.mo.no],[2] lit. 'thing to wear') is a traditional Japanese garment and the national dress of Japan.
    # "The kimono is a wrapped-front garment with square sleeves and a rectangular body, and is worn left side wrapped over right, unless the wearer is deceased."
    - kimono

  upper:
    casual:
      - __fash/styles/upper/casual__
      - __fash/styles/dress/bodice/casual__
    smart:
      - __fash/styles/upper/smart__
      - __fash/styles/dress/bodice/smart__

  lower:
    casual:
      - __fash/styles/dress/length/casual__
      - __fash/styles/dress/skirt/casual__
      - __fash/styles/dress/skirt/hem__
    smart:
      - __fash/styles/dress/length/smart__
      - __fash/styles/dress/skirt/smart__
      - __fash/styles/dress/skirt/hem__


  # The upper part of the dress, covering the torso.
  # Only styles not in upper/* common styles!
  bodice:
    casual:
      # Skirted versions of upper body garments
      # TODO not general, need specific necklines
      # Only good fits for simple skirt silhouettes
      # Also available with their own names such as shirt-dress
      - babydoll
      - cami
      - hoodie
      - shirt
      - sweater
      - sweatshirt
      - t-shirt
      - tank
      - tube
      - tunic

      # TODO Full silhouette, not just bodice
      # Any neckline
      - shift
      - (tent:0.8)
      - straight
      - column

    smart:
      # Not just bodice types, have skirt implications too

      # These go best with simple skirts
      - babydoll
      - blazer
      - cami
      - cocktail
      - little black
      - shirt

      # These go best with fancier skirts
      - basque
      - corset
      - corselette
      - evening

      # Full silhouette, not just bodice
      - column
      - sheath
      - straight

      - illusion-yoke # neckline or yoke attribute

  length:
    casual:
      - __fash/styles/skirt/length/casual__
    smart:
      - __fash/styles/skirt/length/smart__

  sleeve:
    casual:
      - __fash/styles/upper/sleeve/length__
      - __fash/styles/upper/sleeve/length__ __fash/styles/upper/sleeve/casual/common__
      - short __fash/styles/upper/sleeve/casual/short__
    smart:
      - __fash/styles/upper/sleeve/length__
      - __fash/styles/upper/sleeve/length__ __fash/styles/upper/sleeve/smart/common__
      - short __fash/styles/upper/sleeve/smart/short__

  sleeved:
    casual:
      #- dress with __fash/styles/dress/sleeve/casual__ sleeves
      - __fash/styles/upper/neckline/sleeved__ dress
        with __fash/styles/dress/sleeve/casual__ sleeves
    smart:
      #- dress with __fash/styles/dress/sleeve/smart__ sleeves
      - __fash/styles/dress/neckline/smart/sleeved__ dress
        with __fash/styles/dress/sleeve/smart__ sleeves

  sleeveless:
    casual:
      - __fash/styles/upper/neckline/sleeveless__ dress
    smart:
      - __fash/styles/dress/neckline/smart/sleeveless__ dress

  t-shirt:
    - __fash/styles/t-shirt/style__ t-shirt dress
    - __fash/styles/t-shirt/fit__ t-shirt dress
    - __fash/styles/t-shirt/neckline__ t-shirt dress
    - t-shirt dress with __fash/styles/t-shirt/deco__
    - t-shirt dress with __fash/styles/t-shirt/sleeve__ sleeves

  denim:
    - a-line
    - apron
    - belted
    - cami
    - '{(cap:0.6)|short|short tab}-sleeved'
    - cargo
    - overall
    - pinafore
    - shirt
    - sleeveless
    - strapless
    - tank
    - tied-waist

  # The lower part of the dress, covering the legs
  skirt:
    casual:
      - __fash/styles/skirt/casual__-skirted
    smart:
      - __fash/styles/skirt/smart__-skirted

    hem:
      - __fash/styles/skirt/hem__-hem
      #- __fash/styles/skirt/trim__-hem

  waist:
    casual:
      - blouson
      - contrast
      - drop
      - empire
      - __fash/styles/common/gather__
      - '{belt|drawstring|tied|waistband}'
    smart:
      - blouson
      - contrast
      - empire
      - __fash/styles/common/gather__
      # TODO belts

    #- __fash/clothing/ornament/trim/casual__-{hem|trim|yoke} # TODO could be modifier
    #- __fash/clothing/cut/lacing__

  neckline:
    smart:
      sleeved:
        - __fash/styles/neckline/high-neck__
        - __fash/styles/upper/neckline/cold-shoulder__
        - __fash/styles/upper/neckline/off-shoulder__
        - __fash/styles/neckline/plunge-neck__
        - __fash/styles/upper/neckline/t-shirt-like__

      sleeveless:
        - sleeveless __fash/styles/neckline/high-neck__
        - __fash/styles/upper/neckline/cami-like__
        - __fash/styles/upper/neckline/tube-like-long__
        - __fash/styles/upper/neckline/vest-like__
        - __fash/styles/upper/neckline/one-shoulder__
        - __fash/styles/neckline/plunge-neck__

  # Helper
  fit-length:
    lounge:
      - __fash/styles/common/fit/lounge__
      - __fash/styles/skirt/length/intimate__
